[package]
name = "forensics-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "forensics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog = { workspace = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
transport.workspace = true
app-services.workspace = true
domain.workspace = true
infrastructure.workspace = true
persistence-sqlite.workspace = true
evidence-core.workspace = true
volume-bitlocker.workspace = true
artifacts-core.workspace = true
image-e01 = { path = "../../../crates/image-e01" }
fs-ntfs = { path = "../../../crates/fs-ntfs" }
fs-fat = { path = "../../../crates/fs-fat" }
rusqlite.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mcp-client = { path = "../../../crates/mcp-client" }
runtime-cache.workspace = true
tokio = { workspace = true, features = ["full"] }
dirs.workspace = true
base64.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
