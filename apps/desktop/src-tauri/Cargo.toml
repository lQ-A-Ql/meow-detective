[package]
name = "forensics-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "forensics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
transport.workspace = true
app-services.workspace = true
domain.workspace = true
infrastructure.workspace = true
persistence-sqlite.workspace = true
evidence-core.workspace = true
artifacts-core.workspace = true
image-e01 = { path = "../../../crates/image-e01" }
fs-ntfs = { path = "../../../crates/fs-ntfs" }
fs-fat = { path = "../../../crates/fs-fat" }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
uuid = { version = "1", features = ["v4"] }
tracing.workspace = true
tracing-subscriber.workspace = true
mcp-client = { path = "../../../crates/mcp-client" }
tokio = { version = "1", features = ["full"] }
dirs = "5"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
