[package]
name = "rust-fs-btrfs"
version = "0.10.2"
edition = "2021"
license = "MIT"
description = "Pure-Rust Btrfs filesystem driver. Exposes a C ABI (fs_btrfs_*) suitable for FFI from C/C++/Swift/Go."
repository = "https://github.com/antimatter-studios/rust-fs-btrfs"

[lib]
name = "fs_btrfs"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[features]
cli = []

[dependencies]
blake2b_simd = "1.0"
crc32c = "0.6"
miniz_oxide = "0.9.1"
rust-fs-core = "0.3.7"
rust-lzo1x = "0.4.0"
ruzstd = "0.9.0"
sha2 = "0.10"
twox-hash = { version = "2", features = ["xxhash64"], default-features = false }
