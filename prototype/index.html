<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forensics Workbench Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0b0b;
        --bg-elevated: #111111;
        --bg-soft: #171717;
        --bg-hover: #1d1d1d;
        --line: #2a2a2a;
        --line-strong: #3e3e3e;
        --text: #f4f4f4;
        --text-dim: #b8b8b8;
        --text-faint: #7c7c7c;
        --active: #ffffff;
        --danger: #d7d7d7;
        --warn: #c7c7c7;
        --ok: #ededed;
        --info: #dadada;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 32px;
        --topbar-h: 52px;
        --subbar-h: 38px;
        --drawer-h: 188px;
        --inspector-w: 320px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      .app-shell {
        height: 100vh;
        display: grid;
        grid-template-rows: var(--topbar-h) var(--subbar-h) 1fr auto;
        grid-template-areas:
          "topbar"
          "subbar"
          "main"
          "drawer";
      }

      .topbar,
      .subbar,
      .drawer,
      .panel,
      .inspector,
      .table-wrap,
      .viewer-wrap,
      .summary-band,
      .summary-grid,
      .line-block {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .topbar {
        grid-area: topbar;
        display: grid;
        grid-template-columns: 420px 1fr 420px;
        align-items: stretch;
        border-top: 0;
        background: #090909;
      }

      .topbar-section {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }

      .topbar-section:last-child {
        border-right: 0;
        justify-content: flex-end;
      }

      .brand {
        font-family: "Fraunces", serif;
        font-size: 18px;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .case-inline {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
      }

      .pipe {
        color: var(--text-faint);
      }

      .mono {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
      }

      .muted { color: var(--text-dim); }
      .faint { color: var(--text-faint); }

      .nav-strip,
      .action-strip,
      .chip-row,
      .tab-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }

      .nav-item,
      .tab-item,
      .chip,
      .action-btn,
      .mode-btn {
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .nav-item:hover,
      .tab-item:hover,
      .chip:hover,
      .action-btn:hover,
      .mode-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
      }

      .nav-item.active,
      .tab-item.active,
      .chip.active,
      .mode-btn.active {
        background: #fff;
        color: #000;
        border-color: #fff;
      }

      .search-inline {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid var(--line);
        min-width: 0;
        flex: 1;
        max-width: 280px;
      }

      .search-inline input {
        flex: 1;
        border: 0;
        background: transparent;
        outline: none;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        min-width: 0;
      }

      .subbar {
        grid-area: subbar;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 14px;
        background: var(--bg-elevated);
        border-top: 0;
      }

      .subbar-group {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }

      .main {
        grid-area: main;
        overflow: hidden;
      }

      .page {
        display: none;
        height: 100%;
      }

      .page.active {
        display: grid;
        animation: showPage 0.14s linear;
      }

      @keyframes showPage {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .page-grid {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr var(--inspector-w);
        min-height: 0;
      }

      .main-column {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-auto-rows: min-content;
        overflow: auto;
      }

      .inspector {
        background: #0f0f0f;
        border-left: 1px solid var(--line);
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }

      .inspector h3,
      .section-title,
      .page-title {
        margin: 0;
        font-family: "Fraunces", serif;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .page-title {
        font-size: 24px;
      }

      .page-copy,
      .inspector-copy,
      .cell-sub,
      .line-copy {
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.45;
      }

      .summary-band,
      .line-block,
      .panel,
      .table-wrap,
      .viewer-wrap {
        background: transparent;
      }

      .summary-band,
      .panel,
      .line-block,
      .table-wrap,
      .viewer-wrap {
        padding: 12px 14px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-left: 1px solid var(--line);
        margin: 0 14px 14px;
      }

      .summary-cell {
        min-width: 0;
        padding: 12px 12px 14px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .summary-cell label,
      .field label,
      .mini-label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      .summary-cell strong,
      .field strong,
      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }

      .dense-split {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 0;
      }

      .dense-col {
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--line);
      }

      .dense-col:last-child { border-right: 0; }

      .tree-list,
      .family-list,
      .saved-list,
      .field-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree-item,
      .family-item,
      .saved-item,
      .line-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }

      .tree-item:hover,
      .family-item:hover,
      .saved-item:hover,
      .line-item:hover,
      tbody tr:hover {
        background: var(--bg-soft);
      }

      .tree-item.active,
      .family-item.active,
      .saved-item.active,
      tbody tr.active {
        background: #fff;
        color: #000;
      }

      .tree-item.active .faint,
      .family-item.active .faint,
      .saved-item.active .faint,
      tbody tr.active .faint,
      tbody tr.active .mono,
      .tree-item.active .mono {
        color: #444;
      }

      .tree-title,
      .family-title,
      .saved-title,
      .line-title {
        font-size: 13px;
        font-weight: 600;
      }

      .table-wrap {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }

      .table-scroll {
        min-height: 0;
        overflow: auto;
        border-top: 1px solid var(--line);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        text-align: left;
        padding: 10px 10px;
        background: #0f0f0f;
        color: var(--text-faint);
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }

      tbody td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--text-dim);
        vertical-align: top;
      }

      tbody tr { cursor: pointer; }

      .viewer-wrap {
        display: grid;
        grid-template-rows: auto auto 1fr;
        min-height: 260px;
        border-top: 1px solid var(--line);
      }

      .viewer-body,
      .snippet-box,
      .timeline-band,
      .report-area {
        min-height: 0;
        overflow: auto;
        padding-top: 12px;
        font-size: 12px;
        line-height: 1.6;
      }

      .hex,
      .trace-log {
        white-space: pre-wrap;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
      }

      mark {
        background: #fff;
        color: #000;
        padding: 0 2px;
      }

      .timeline-band {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .timeline-slot {
        min-height: 88px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 8px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
      }

      .timeline-bar {
        width: 100%;
        background: #fff;
      }

      .timeline-slot.dim .timeline-bar { background: #8c8c8c; }
      .timeline-slot.soft .timeline-bar { background: #bdbdbd; }

      .fields {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .field {
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .field code,
      .field .value {
        display: block;
        margin-top: 6px;
        color: var(--text);
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        line-height: 1.5;
      }

      .mini-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

      .drawer {
        grid-area: drawer;
        height: 78px;
        overflow: hidden;
        background: #090909;
        transition: height 0.18s linear;
      }

      .drawer.open { height: var(--drawer-h); }

      .drawer-head {
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 14px;
      }

      .drawer-body {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        border-top: 1px solid var(--line);
        min-height: calc(var(--drawer-h) - 78px);
      }

      .drawer-col {
        padding: 12px;
        border-right: 1px solid var(--line);
        overflow: auto;
      }

      .drawer-col:last-child { border-right: 0; }

      .job-row,
      .trace-row,
      .warn-row {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }

      .progress {
        height: 6px;
        margin-top: 6px;
        background: #1a1a1a;
      }

      .progress > span {
        display: block;
        height: 100%;
        background: #fff;
      }

      .split-topline {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .line-block-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-left: 1px solid var(--line);
      }

      .line-cell {
        padding: 10px;
        border-right: 1px solid var(--line);
      }

      @media (max-width: 1380px) {
        .topbar {
          grid-template-columns: 1fr;
          height: auto;
        }
        .topbar-section {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          min-height: 44px;
        }
        .page-grid,
        .dense-split,
        .drawer-body {
          grid-template-columns: 1fr;
        }
        .summary-grid,
        .line-block-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-section">
          <div class="brand">Forensics Workbench</div>
          <span class="pipe">|</span>
          <div class="case-inline mono">
            <span>CASE 24-031</span>
            <span class="pipe">/</span>
            <span class="muted">FINCH</span>
            <span class="pipe">/</span>
            <span class="faint">examiner Qin Ao</span>
          </div>
        </div>
        <div class="topbar-section">
          <nav class="nav-strip" id="page-nav"></nav>
        </div>
        <div class="topbar-section">
          <label class="search-inline">
            <span class="mono">⌕</span>
            <input type="text" value="credential OR wallet OR exfil" />
          </label>
          <div class="action-strip">
            <button class="action-btn" id="drawer-toggle">TASKS</button>
            <button class="action-btn">EXPORT</button>
            <button class="action-btn">SETTINGS</button>
          </div>
        </div>
      </header>

      <div class="subbar">
        <div class="subbar-group" id="subbar-left"></div>
        <div class="subbar-group" id="subbar-right"></div>
      </div>

      <main class="main">
        <section class="page active" data-page="home"></section>
        <section class="page" data-page="files"></section>
        <section class="page" data-page="search"></section>
        <section class="page" data-page="timeline"></section>
        <section class="page" data-page="artifacts"></section>
        <section class="page" data-page="reports"></section>
      </main>

      <section class="drawer" id="drawer">
        <div class="drawer-head">
          <div>
            <div class="mini-label">TASK / TRACE</div>
            <div style="margin-top:6px;font-family:'Fraunces',serif;font-size:19px;">Operational Lane</div>
          </div>
          <div class="subbar-group">
            <span class="chip active">3 running</span>
            <button class="action-btn" id="drawer-toggle-secondary">EXPAND</button>
          </div>
        </div>
        <div class="drawer-body">
          <div class="drawer-col"><div class="mini-label">JOBS</div><div id="job-list"></div></div>
          <div class="drawer-col"><div class="mini-label">WARNINGS</div><div id="warn-list"></div></div>
          <div class="drawer-col"><div class="mini-label">TRACE</div><div id="trace-list" class="trace-log"></div></div>
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
