[package]
name = "meow-plugin-wechat"
version = "0.1.0"
edition = "2021"
publish = false

# Only the cdylib is shipped; the rlib exists so the crate's own unit tests
# can link (see plugins-src/README.md).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plugin-api = { path = "../../crates/plugin-api" }
# Pure parser dependency: bundled SQLite, no C toolchain requirement beyond
# what the main workspace already uses (rusqlite 0.31 + serialize for
# in-memory deserialization of evidence bytes).
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
