[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/domain",
  "crates/app-services",
  "crates/infrastructure",
  "crates/persistence-sqlite",
  "crates/runtime-cache",
  "crates/evidence-core",
  "crates/fs-ntfs",
  "crates/fs-fat",
  "crates/fs-exfat",
  "crates/image-raw",
  "crates/image-e01",
  "crates/catalog",
  "crates/ingest",
  "crates/mcp-client",
  "crates/search",
  "crates/timeline",
  "crates/artifacts-core",
  "crates/artifacts-windows",
  "crates/artifacts-linux",
  "crates/artifacts-ios",
  "crates/artifacts-macos",
  "crates/artifacts-android",
  "crates/reports",
  "crates/transport",
  "crates/testing",
  "crates/evtx-patched",
  "crates/containers-pst",
  "crates/fs-ext4",
  "crates/fs-btrfs",
  "crates/fs-apfs",
  "crates/fs-xfs",
  "crates/fs-hfsplus",
  "crates/exchange",
  "crates/cloud-audit",
  "crates/gql",
  "crates/updater",
  "crates/crash_handler",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["lQ-A-Ql"]
license = "MIT"

[workspace.dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
thiserror = "~2.0"
chrono = { version = "~0.4", features = ["serde"] }
anyhow = "~1.0"
crossbeam-channel = "~0.5"
regex = "~1"
base64 = "~0.22"
uuid = { version = "~1", features = ["v4"] }
num_cpus = "~1"
rayon = "~1.10"
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["env-filter", "fmt", "json"] }
tauri = { version = "~2", features = [] }
tauri-build = { version = "~2", features = [] }
transport = { path = "crates/transport" }
app-services = { path = "crates/app-services" }
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }
persistence-sqlite = { path = "crates/persistence-sqlite" }
evidence-core = { path = "crates/evidence-core" }
fs-ntfs = { path = "crates/fs-ntfs" }
fs-fat = { path = "crates/fs-fat" }
fs-exfat = { path = "crates/fs-exfat" }
fs-ext4 = { path = "crates/fs-ext4" }
fs-btrfs = { path = "crates/fs-btrfs" }
fs-apfs = { path = "crates/fs-apfs" }
fs-xfs = { path = "crates/fs-xfs" }
fs-hfsplus = { path = "crates/fs-hfsplus" }
image-raw = { path = "crates/image-raw" }
image-e01 = { path = "crates/image-e01" }
catalog = { path = "crates/catalog" }
ingest = { path = "crates/ingest" }
search = { path = "crates/search" }
timeline = { path = "crates/timeline" }
artifacts-core = { path = "crates/artifacts-core" }
artifacts-windows = { path = "crates/artifacts-windows" }
artifacts-linux = { path = "crates/artifacts-linux" }
artifacts-ios = { path = "crates/artifacts-ios" }
artifacts-macos = { path = "crates/artifacts-macos" }
artifacts-android = { path = "crates/artifacts-android" }
reports = { path = "crates/reports" }
testing = { path = "crates/testing" }
runtime-cache = { path = "crates/runtime-cache" }
evtx = { path = "crates/evtx-patched", default-features = false }
containers-pst = { path = "crates/containers-pst" }
exchange = { path = "crates/exchange" }
cloud-audit = { path = "crates/cloud-audit" }
gql = { path = "crates/gql" }
updater = { path = "crates/updater" }
crash_handler = { path = "crates/crash_handler" }
lz4_flex = "0.13"
toml = "0.8"
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
winres = "0.1"
