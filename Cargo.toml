[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/domain",
  "crates/app-services",
  "crates/infrastructure",
  "crates/persistence-sqlite",
  "crates/runtime-cache",
  "crates/evidence-core",
  "crates/fs-ntfs",
  "crates/fs-fat",
  "crates/fs-exfat",
  "crates/image-e01",
  "crates/mcp-client",
  "crates/search",
  "crates/timeline",
  "crates/artifacts-core",
  "crates/artifacts-windows",
  "crates/artifacts-linux",
  "crates/reports",
  "crates/transport",
  "crates/testing",
  "crates/evtx-patched",
  "crates/containers-pst",
  "crates/fs-ext4",
  "crates/fs-btrfs",
  "crates/fs-xfs",
  "crates/fs-lvm",
  "crates/volume-bitlocker",
  "crates/memory-windows",
  "crates/ceph-wire",
  "crates/rocksdb-wire",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["lQ-A-Ql"]
license = "MIT"

[workspace.dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
thiserror = "~2.0"
chrono = { version = "~0.4", features = ["serde"] }
anyhow = "~1.0"
async-trait = "0.1"
crossbeam-channel = "~0.5"
regex = "~1"
base64 = "~0.22"
aes-gcm = "~0.10"
chacha20poly1305 = "~0.10"
cbc = "~0.1"
hmac = "~0.12"
sha1 = "~0.10"
uuid = { version = "~1", features = ["v4"] }
num_cpus = "~1"
rayon = "~1.12"
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["env-filter", "fmt", "json"] }
tauri = { version = "~2", features = [] }
tauri-build = { version = "~2", features = [] }
tauri-plugin-dialog = "2"
transport = { path = "crates/transport" }
app-services = { path = "crates/app-services" }
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }
persistence-sqlite = { path = "crates/persistence-sqlite" }
evidence-core = { path = "crates/evidence-core" }
fs-ntfs = { path = "crates/fs-ntfs" }
fs-fat = { path = "crates/fs-fat" }
fs-exfat = { path = "crates/fs-exfat" }
fs-ext4 = { path = "crates/fs-ext4" }
fs-btrfs = { path = "crates/fs-btrfs" }
fs-xfs = { path = "crates/fs-xfs" }
fs-lvm = { path = "crates/fs-lvm" }
volume-bitlocker = { path = "crates/volume-bitlocker" }
memory-windows = { path = "crates/memory-windows" }
image-e01 = { path = "crates/image-e01" }
search = { path = "crates/search" }
timeline = { path = "crates/timeline" }
artifacts-core = { path = "crates/artifacts-core" }
artifacts-windows = { path = "crates/artifacts-windows" }
artifacts-linux = { path = "crates/artifacts-linux" }
reports = { path = "crates/reports" }
testing = { path = "crates/testing" }
runtime-cache = { path = "crates/runtime-cache" }
evtx = { path = "crates/evtx-patched", default-features = false, features = ["multithreading"] }
flate2 = "1"
containers-pst = { path = "crates/containers-pst" }
ceph-wire = { path = "crates/ceph-wire" }
rocksdb-wire = { path = "crates/rocksdb-wire" }
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tempfile = "3"
hex = "0.4"
once_cell = "1"
memchr = "2"
byteorder = "1"
encoding_rs = "0.8"
csv = "1"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1" }
unicode-normalization = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Compression"] }
dirs = "6"
lz4_flex = "~0.13"
xxhash-rust = { version = "~0.8", features = ["xxh3"] }
toml = "~0.8"
ed25519-dalek = "~2"
sha2 = "~0.10"
tantivy = "0.26"
md-5 = "~0.10"
des = "~0.8"
aes = "~0.8"
# AES-CCM unwraps the BitLocker VMK and FVEK. Pinned to the 0.5 release line
# rather than the 0.6 prerelease.
ccm = "~0.5"
# XTS-AES sector mode for BitLocker methods 0x8004/0x8005. Pinned to ~0.5, which
# tracks cipher 0.4 and therefore the aes 0.8 line above. 0.6 moves to cipher 0.5
# / aes 0.9 and would add a third AES generation to the tree for no gain.
xts-mode = "~0.5"
cipher = "~0.4"
zeroize = "~1"
rand = "~0.8"
mailparse = "0.16"
zip = { version = "~2", default-features = false, features = ["deflate"] }
quick-xml = "~0.41"
lopdf = "0.44"
winres = "~0.1"
binread = "~2.2"
mimalloc = { version = "0.1", default-features = false }
