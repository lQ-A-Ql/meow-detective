    { id = "RUSTSEC-2024-0418", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; Tauri 2 linux stack pulls gtk3 bindings transitively via wry/tao and no direct safe upgrade is available in this repo." },
    { id = "RUSTSEC-2024-0411", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; Tauri 2 linux stack pulls gtk3 bindings transitively via wry/tao and no direct safe upgrade is available in this repo." },
    { id = "RUSTSEC-2024-0417", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; Tauri 2 linux stack pulls gtk3 bindings transitively via wry/tao and no direct safe upgrade is available in this repo." },
    { id = "RUSTSEC-2024-0414", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; Tauri 2 linux stack pulls gtk3 bindings transitively via wry/tao and no direct safe upgrade is available in this repo." },
    { id = "RUSTSEC-2024-0415", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; Tauri 2 linux stack pulls gtk3 bindings transitively via wry/tao and no direct safe upgrade is available in this repo." },
    { id = "RUSTSEC-2024-0420", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; Tauri 2 linux stack pulls gtk3 bindings transitively via wry/tao and no direct safe upgrade is available in this repo." },
    { id = "RUSTSEC-2024-0370", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; gtk/glib transitive proc-macro-error path from Tauri linux dependencies; blocked on upstream." },
    { id = "RUSTSEC-2025-0075", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; urlpattern through tauri-utils pulls rust-unic transitive crates; blocked on upstream Tauri dependency refresh." },
