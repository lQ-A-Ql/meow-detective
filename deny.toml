# Dependency policy for Forensics Workbench.
#
# Every exception must include owner, reason, and expiry date. Expired entries
# should be removed or renewed only after re-reviewing the dependency path.
#
# --- Exception format ---
# Advisory exceptions live in [advisories].ignore and use this template:
#   { id = "<RUSTSEC-ID>", reason = "owner: <name|team>; expires: <YYYY-MM-DD>; <technical justification>" }
#
# License exceptions live in [licenses].exceptions and use this template:
#   { name = "<crate>", version = "*", allow = ["<license-id>"], reason = "owner: ...; expires: ...; ..." }
#
# Ban exceptions live in [bans].skip and use this template:
#   { name = "<crate>", version = "<semver>", reason = "owner: ...; expires: ...; ..." }
#
# Every exception MUST include owner, expires, and a technical reason. Entries
# whose expiry has passed will fail CI (enforced by check-deny-exceptions.ps1).

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-db"
# Reject exceptions once the advisory no longer matches the resolved graph.
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "owner: Dependency Maintenance; expires: 2026-11-15; reviewed: 2026-10-16, Low, first renewal. proc-macro-error 1.0.4 is build-time only via glib-macros/gtk3-macros on the Linux Tauri path, absent from the Windows target. No patched release; replace through upstream GTK/Tauri. See docs/dependency-decisions.md." },
    { id = "RUSTSEC-2025-0075", reason = "owner: Dependency Maintenance; expires: 2026-11-15; reviewed: 2026-10-16, Low, first renewal. unic 0.9.0 is transitive through urlpattern 0.3.0 and tauri-utils 2.9.3 for trusted application capability/configuration URL patterns, not a forensic evidence parser. No patched unic releases; track upstream replacement. See docs/dependency-decisions.md." },
    { id = "RUSTSEC-2025-0080", reason = "owner: Dependency Maintenance; expires: 2026-11-15; reviewed: 2026-10-16, Low, first renewal. unic 0.9.0 is transitive through urlpattern 0.3.0 and tauri-utils 2.9.3 for trusted application capability/configuration URL patterns, not a forensic evidence parser. No patched unic releases; track upstream replacement. See docs/dependency-decisions.md." },
    { id = "RUSTSEC-2025-0081", reason = "owner: Dependency Maintenance; expires: 2026-11-15; reviewed: 2026-10-16, Low, first renewal. unic 0.9.0 is transitive through urlpattern 0.3.0 and tauri-utils 2.9.3 for trusted application capability/configuration URL patterns, not a forensic evidence parser. No patched unic releases; track upstream replacement. See docs/dependency-decisions.md." },
    { id = "RUSTSEC-2025-0098", reason = "owner: Dependency Maintenance; expires: 2026-11-15; reviewed: 2026-10-16, Low, first renewal. unic 0.9.0 is transitive through urlpattern 0.3.0 and tauri-utils 2.9.3 for trusted application capability/configuration URL patterns, not a forensic evidence parser. No patched unic releases; track upstream replacement. See docs/dependency-decisions.md." },
    { id = "RUSTSEC-2025-0100", reason = "owner: Dependency Maintenance; expires: 2026-11-15; reviewed: 2026-10-16, Low, first renewal. unic 0.9.0 is transitive through urlpattern 0.3.0 and tauri-utils 2.9.3 for trusted application capability/configuration URL patterns, not a forensic evidence parser. No patched unic releases; track upstream replacement. See docs/dependency-decisions.md." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # BSL-1.0 is used by xxhash-rust for the validated RocksDB XXH3 block checksum.
    # Owner: Ceph BlueStore Stage 5; reviewed: 2026-07-14; OSI-approved permissive license.
    "BSL-1.0",
    "CC0-1.0",
    # CDLA-Permissive-2.0 is used by webpki-root-certs / webpki-roots (transitive via rustls/Tauri).
    # Owner: Registry Quality Maintenance; reviewed: 2026-06-21; acceptable for root-CA data bundles.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
