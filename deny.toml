    { id = "RUSTSEC-2025-0081", reason = "owner: Stage 5 CI / Fixture Agent; expires: 2026-09-01; urlpattern through tauri-utils pulls rust-unic transitive crates; blocked on upstream Tauri dependency refresh." },
