name: Backend CI

on:
  workflow_dispatch:
    inputs:
      benchmark_level:
        description: 'Performance fixture size'
        type: choice
        options: [small, medium, large]
        default: small
  schedule:
    - cron: '17 21 * * 0'
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'scripts/**'
      - 'testdata/**'
      - 'vendor/bbolt-rs/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend assets for the Tauri context
        run: |
          pnpm --dir frontend install --frozen-lockfile
          ./scripts/check-tauri-version-alignment.ps1
          pnpm --dir frontend build
      - name: Format
        shell: pwsh
        run: |
          # cargo-fmt batches all workspace targets into one rustfmt command line,
          # which exceeds the Windows 32K limit (os error 206). Format per package.
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $failed = @()
          foreach ($package in $metadata.packages) {
            cargo fmt --package $package.name -- --check
            if ($LASTEXITCODE -ne 0) { $failed += $package.name }
          }
          if ($failed.Count -gt 0) { throw ("cargo fmt failed for: " + ($failed -join ', ')) }
      - name: Documentation drift guard
        shell: pwsh
        run: ./scripts/check-doc-drift.ps1
      - name: Documentation archive guard
        shell: pwsh
        run: ./scripts/check-doc-archive.ps1
      - name: Import optimization guard
        shell: pwsh
        run: ./scripts/check-import-optimization-guard.ps1
      - name: Stage 0 backend structure guards
        shell: powershell
        env:
          RUST_MODULE_SIZE_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_FUNCTION_SIZE_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_TEST_LAYOUT_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_MODULE_SIZE_BOOTSTRAP_SHA256: ${{ vars.RUST_MODULE_SIZE_BOOTSTRAP_SHA256 }}
          RUST_FUNCTION_SIZE_BOOTSTRAP_SHA256: ${{ vars.RUST_FUNCTION_SIZE_BOOTSTRAP_SHA256 }}
          RUST_TEST_LAYOUT_BOOTSTRAP_SHA256: ${{ vars.RUST_TEST_LAYOUT_BOOTSTRAP_SHA256 }}
        run: |
          ./scripts/check-module-size.ps1 -SelfTest
          ./scripts/check-module-size.ps1
          ./scripts/check-rust-function-size.ps1 -SelfTest
          ./scripts/check-rust-function-size.ps1
          ./scripts/check-rust-test-layout.ps1 -SelfTest
          ./scripts/check-rust-test-layout.ps1
          ./scripts/check-crate-budget.ps1 -SelfTest
          ./scripts/check-crate-budget.ps1
          ./scripts/check-private-real-sample-tests.ps1 -SelfTest
          ./scripts/check-private-real-sample-tests.ps1
          ./scripts/check-stage0-boundary-guard.ps1
          ./scripts/check-stage2-platform-boundary.ps1
          ./scripts/check-stage3-command-boundary.ps1
          ./scripts/check-stage4-service-boundary.ps1
          ./scripts/check-stage5-parser-boundary.ps1
          ./scripts/check-parser-ownership.ps1
          ./scripts/check-stage6-test-separation.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          FORENSICS_BOLT_READER_EXE: ${{ github.workspace }}\target\debug\meow-bolt-worker.exe
        run: |
          cargo build -p containers-bolt --bin meow-bolt-worker
          cargo test --workspace
      - name: Benchmark catalog and baseline structure
        shell: pwsh
        run: ./scripts/check-benchmark-regression.ps1 -StructureOnly
      - name: Small performance structure regression
        shell: pwsh
        run: |
          ./scripts/check-benchmark-regression.ps1 -FixtureLevel small -Runs 1 -OutputDir output/ci-performance-small
          $results = @(Get-ChildItem -LiteralPath output/ci-performance-small -Filter 'benchmark-*.json')
          if ($results.Count -ne 1) { throw 'Expected exactly one performance result file' }
          ./scripts/check-benchmark-result-validation.ps1 -ResultsPath $results[0].FullName -Runs 1 -FixtureLevel small
      - name: Extended performance regression
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          BENCHMARK_LEVEL: ${{ github.event_name == 'schedule' && 'large' || inputs.benchmark_level }}
        run: ./scripts/check-benchmark-regression.ps1 -FixtureLevel $env:BENCHMARK_LEVEL -Runs 3 -OutputDir output/ci-performance-extended
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression
          path: output/ci-performance-*
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public forensic corpus and bounded corruption smoke
        run: |
          python scripts/check-forensic-corpus.py --run --group small
          python scripts/check-forensic-corpus.py --run --group corrupt
      - name: Upload forensic corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-corpus
          path: artifacts/corpus
          if-no-files-found: ignore
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Rust coverage
        env:
          FORENSICS_BOLT_READER_EXE: ${{ github.workspace }}\target\debug\meow-bolt-worker.exe
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path rust-lcov.info
      - name: Upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: rust-lcov.info
      - name: Desktop build
        run: cargo build -p forensics-desktop
      - name: Release guard
        shell: pwsh
        run: ./scripts/check-release-guard.ps1
      - name: Media protocol guard
        shell: pwsh
        run: ./scripts/check-media-protocol-guard.ps1
      - name: Command SQL boundary guard
        shell: pwsh
        run: ./scripts/check-command-sql-boundary.ps1
      - name: Dependency exception guard
        shell: pwsh
        run: ./scripts/check-deny-exceptions.ps1
      - name: EVTX dependency decision guard
        shell: pwsh
        run: ./scripts/check-evtx-dependency-decision.ps1
      - name: BitLocker credential guard
        shell: pwsh
        run: |
          ./scripts/check-bitlocker-credential-guard.ps1 -SelfTest
          ./scripts/check-bitlocker-credential-guard.ps1
      - name: Stage 5 regression guard
        shell: pwsh
        run: ./scripts/check-stage5-regression-guard.ps1
      - name: Stage 6 persistence boundary guard
        shell: pwsh
        run: ./scripts/check-stage6-persistence-boundary.ps1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --db "${{ runner.temp }}/cargo-audit-db"
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate backend SBOM
        shell: pwsh
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --spec-version 1.5 --override-filename backend-sbom
          Move-Item -LiteralPath apps/desktop/src-tauri/backend-sbom.json -Destination backend-sbom.json -Force
          $sbom = Get-Content backend-sbom.json -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') { throw 'backend SBOM is not CycloneDX' }
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
