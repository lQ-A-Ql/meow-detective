name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'scripts/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Stage 0 backend structure guards
        shell: powershell
        env:
          RUST_MODULE_SIZE_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_FUNCTION_SIZE_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_TEST_LAYOUT_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_MODULE_SIZE_BOOTSTRAP_SHA256: ${{ vars.RUST_MODULE_SIZE_BOOTSTRAP_SHA256 }}
          RUST_FUNCTION_SIZE_BOOTSTRAP_SHA256: ${{ vars.RUST_FUNCTION_SIZE_BOOTSTRAP_SHA256 }}
          RUST_TEST_LAYOUT_BOOTSTRAP_SHA256: ${{ vars.RUST_TEST_LAYOUT_BOOTSTRAP_SHA256 }}
        run: |
          ./scripts/check-module-size.ps1 -SelfTest
          ./scripts/check-module-size.ps1
          ./scripts/check-rust-function-size.ps1 -SelfTest
          ./scripts/check-rust-function-size.ps1
          ./scripts/check-rust-test-layout.ps1 -SelfTest
          ./scripts/check-rust-test-layout.ps1
          ./scripts/check-stage0-boundary-guard.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Rust coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path rust-lcov.info
      - name: Upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: rust-lcov.info
      - name: Desktop build
        run: cargo build -p forensics-desktop
      - name: Release guard
        shell: pwsh
        run: ./scripts/check-release-guard.ps1
      - name: Media protocol guard
        shell: pwsh
        run: ./scripts/check-media-protocol-guard.ps1
      - name: Command SQL boundary guard
        shell: pwsh
        run: ./scripts/check-command-sql-boundary.ps1
      - name: Documentation drift guard
        shell: pwsh
        run: ./scripts/check-doc-drift.ps1
      - name: Documentation archive guard
        shell: pwsh
        run: ./scripts/check-doc-archive.ps1
      - name: Dependency exception guard
        shell: pwsh
        run: ./scripts/check-deny-exceptions.ps1
      - name: EVTX dependency decision guard
        shell: pwsh
        run: ./scripts/check-evtx-dependency-decision.ps1
      - name: Stage 5 regression guard
        shell: pwsh
        run: ./scripts/check-stage5-regression-guard.ps1
      - name: Import optimization guard
        shell: pwsh
        run: ./scripts/check-import-optimization-guard.ps1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate backend SBOM
        shell: pwsh
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --spec-version 1.5 --override-filename backend-sbom
          Move-Item -LiteralPath apps/desktop/src-tauri/backend-sbom.json -Destination backend-sbom.json -Force
          $sbom = Get-Content backend-sbom.json -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') { throw 'backend SBOM is not CycloneDX' }
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
