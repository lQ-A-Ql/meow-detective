name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'scripts/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Desktop build
        run: cargo build -p forensics-desktop
      - name: Release guard
        shell: pwsh
        run: ./scripts/check-release-guard.ps1
      - name: Dependency exception guard
        shell: pwsh
        run: ./scripts/check-deny-exceptions.ps1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate backend SBOM
        shell: pwsh
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --spec-version 1.5 --override-filename backend-sbom
          Move-Item -LiteralPath apps/desktop/src-tauri/backend-sbom.json -Destination backend-sbom.json -Force
          $sbom = Get-Content backend-sbom.json -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') { throw 'backend SBOM is not CycloneDX' }
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
