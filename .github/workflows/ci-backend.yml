name: Backend CI

on:
  workflow_dispatch:
    inputs:
      benchmark_level:
        description: 'Performance fixture size'
        type: choice
        options: [small, medium, large]
        default: small
  schedule:
    - cron: '17 21 * * 0'
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'scripts/**'
      - 'testdata/**'
      - 'vendor/bbolt-rs/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare workspace temporary files and diagnostics
        shell: pwsh
        run: |
          $temporary = Join-Path $env:GITHUB_WORKSPACE 'output/ci-runtime/tmp'
          $logs = Join-Path $env:GITHUB_WORKSPACE 'output/ci-runtime/logs'
          New-Item -ItemType Directory -Path $temporary, $logs -Force | Out-Null
          "TEMP=$temporary" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "TMP=$temporary" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend assets for the Tauri context
        run: |
          pnpm --dir frontend install --frozen-lockfile
          ./scripts/check-tauri-version-alignment.ps1
          pnpm --dir frontend build
      - name: Format
        shell: pwsh
        run: |
          # cargo-fmt batches all workspace targets into one rustfmt command line,
          # which exceeds the Windows 32K limit (os error 206). Format per package.
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $failed = @()
          foreach ($package in $metadata.packages) {
            cargo fmt --package $package.name -- --check
            if ($LASTEXITCODE -ne 0) { $failed += $package.name }
          }
          if ($failed.Count -gt 0) { throw ("cargo fmt failed for: " + ($failed -join ', ')) }
      - name: Documentation drift guard
        shell: pwsh
        run: ./scripts/check-doc-drift.ps1
      - name: Documentation archive guard
        shell: pwsh
        run: ./scripts/check-doc-archive.ps1
      - name: Import optimization guard
        shell: pwsh
        run: ./scripts/check-import-optimization-guard.ps1
      - name: Stage 0 backend structure guards
        shell: powershell
        env:
          RUST_MODULE_SIZE_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_FUNCTION_SIZE_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_TEST_LAYOUT_BASELINE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_MODULE_SIZE_BOOTSTRAP_SHA256: ${{ vars.RUST_MODULE_SIZE_BOOTSTRAP_SHA256 }}
          RUST_FUNCTION_SIZE_BOOTSTRAP_SHA256: ${{ vars.RUST_FUNCTION_SIZE_BOOTSTRAP_SHA256 }}
          RUST_TEST_LAYOUT_BOOTSTRAP_SHA256: ${{ vars.RUST_TEST_LAYOUT_BOOTSTRAP_SHA256 }}
        run: |
          ./scripts/check-module-size.ps1 -SelfTest
          ./scripts/check-module-size.ps1
          ./scripts/check-rust-function-size.ps1 -SelfTest
          ./scripts/check-rust-function-size.ps1
          ./scripts/check-rust-test-layout.ps1 -SelfTest
          ./scripts/check-rust-test-layout.ps1
          ./scripts/check-crate-budget.ps1 -SelfTest
          ./scripts/check-crate-budget.ps1
          ./scripts/check-private-real-sample-tests.ps1 -SelfTest
          ./scripts/check-private-real-sample-tests.ps1
          ./scripts/check-stage0-boundary-guard.ps1
          ./scripts/check-stage2-platform-boundary.ps1
          ./scripts/check-stage3-command-boundary.ps1
          ./scripts/check-stage4-service-boundary.ps1
          ./scripts/check-stage5-parser-boundary.ps1
          ./scripts/check-parser-ownership.ps1
          ./scripts/check-stage6-test-separation.ps1
      - name: CI native command runner self-test
        shell: pwsh
        run: ./scripts/test-ci-native.ps1
      - name: Clippy
        shell: pwsh
        run: ./scripts/run-ci-native.ps1 -FilePath cargo -Arguments @('clippy', '--workspace', '--all-targets', '--', '-D', 'warnings') -LogPath output/ci-runtime/logs/clippy.log
      - name: Test
        shell: pwsh
        env:
          FORENSICS_BOLT_READER_EXE: ${{ github.workspace }}\target\debug\meow-bolt-worker.exe
        run: |
          ./scripts/run-ci-native.ps1 -FilePath cargo -Arguments @('build', '-p', 'containers-bolt', '--bin', 'meow-bolt-worker') -LogPath output/ci-runtime/logs/bolt-worker-build.log
          ./scripts/run-ci-native.ps1 -FilePath cargo -Arguments @('test', '--workspace', '--no-fail-fast') -LogPath output/ci-runtime/logs/workspace-tests.log
      - name: Benchmark catalog and baseline structure
        shell: pwsh
        run: ./scripts/check-benchmark-regression.ps1 -StructureOnly
      - name: Small performance structure regression
        id: benchmark_small
        shell: pwsh
        run: |
          Start-Transcript -Path output/ci-runtime/logs/benchmark-small.log
          try {
            'started=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            ./scripts/check-benchmark-regression.ps1 -FixtureLevel small -Runs 1 -OutputDir output/ci-performance-small
            $results = @(Get-ChildItem -LiteralPath output/ci-performance-small -Filter 'benchmark-*.json')
            if ($results.Count -ne 1) { throw 'Expected exactly one performance result file' }
            ./scripts/check-benchmark-result-validation.ps1 -ResultsPath $results[0].FullName -Runs 1 -FixtureLevel small
          } finally {
            Stop-Transcript
          }
      - name: Extended performance regression
        id: benchmark_extended
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          BENCHMARK_LEVEL: ${{ github.event_name == 'schedule' && 'large' || inputs.benchmark_level }}
        run: |
          Start-Transcript -Path output/ci-runtime/logs/benchmark-extended.log
          try {
            'started=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            ./scripts/check-benchmark-regression.ps1 -FixtureLevel $env:BENCHMARK_LEVEL -Runs 3 -OutputDir output/ci-performance-extended
          } finally {
            Stop-Transcript
          }
      - name: Upload performance evidence
        if: ${{ always() && (steps.benchmark_small.outputs.started == 'true' || steps.benchmark_extended.outputs.started == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression
          path: output/ci-performance-*
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public forensic corpus and bounded corruption smoke
        run: |
          python scripts/check-forensic-corpus.py --run --group small
          python scripts/check-forensic-corpus.py --run --group corrupt
      - name: Upload forensic corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-corpus
          path: artifacts/corpus
          if-no-files-found: ignore
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Reclaim test build space before coverage
        shell: pwsh
        run: |
          # The instrumented build doubles target size; drop non-cacheable test outputs so the runner disk does not fill.
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free -AutoSize | Out-String | Write-Host
          $debug = Join-Path $env:GITHUB_WORKSPACE 'target/debug'
          foreach ($name in @('incremental', 'examples')) {
            $path = Join-Path $debug $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }
          $deps = Join-Path $debug 'deps'
          if (Test-Path -LiteralPath $deps) {
            Get-ChildItem -LiteralPath $deps -File | Where-Object { $_.Extension -in '.exe', '.pdb' } | Remove-Item -Force
          }
          Get-ChildItem -LiteralPath $env:TEMP -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free -AutoSize | Out-String | Write-Host
      - name: Rust coverage
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          FORENSICS_BOLT_READER_EXE: ${{ github.workspace }}\target\debug\meow-bolt-worker.exe
        run: ./scripts/run-ci-native.ps1 -FilePath cargo -Arguments @('llvm-cov', '--workspace', '--all-targets', '--lcov', '--output-path', 'rust-lcov.info') -LogPath output/ci-runtime/logs/coverage.log
      - name: Upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: rust-lcov.info
      - name: Desktop build
        shell: pwsh
        run: ./scripts/run-ci-native.ps1 -FilePath cargo -Arguments @('build', '-p', 'forensics-desktop') -LogPath output/ci-runtime/logs/desktop-build.log
      - name: Release guard
        shell: pwsh
        run: ./scripts/check-release-guard.ps1
      - name: Media protocol guard
        shell: pwsh
        run: ./scripts/check-media-protocol-guard.ps1
      - name: Command SQL boundary guard
        shell: pwsh
        run: ./scripts/check-command-sql-boundary.ps1
      - name: Dependency exception guard
        shell: pwsh
        run: ./scripts/check-deny-exceptions.ps1
      - name: EVTX dependency decision guard
        shell: pwsh
        run: ./scripts/check-evtx-dependency-decision.ps1
      - name: BitLocker credential guard
        shell: pwsh
        run: |
          ./scripts/check-bitlocker-credential-guard.ps1 -SelfTest
          ./scripts/check-bitlocker-credential-guard.ps1
      - name: Stage 5 regression guard
        shell: pwsh
        run: ./scripts/check-stage5-regression-guard.ps1
      - name: Stage 6 persistence boundary guard
        shell: pwsh
        run: ./scripts/check-stage6-persistence-boundary.ps1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --db "${{ github.workspace }}/output/ci-runtime/cargo-audit-db"
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate backend SBOM
        shell: pwsh
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --spec-version 1.5 --override-filename backend-sbom
          Move-Item -LiteralPath apps/desktop/src-tauri/backend-sbom.json -Destination backend-sbom.json -Force
          $sbom = Get-Content backend-sbom.json -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') { throw 'backend SBOM is not CycloneDX' }
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: output/ci-runtime/logs
          if-no-files-found: ignore
