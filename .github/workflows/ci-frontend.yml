name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Build
        run: pnpm --dir frontend build
      - name: Test
        run: pnpm --dir frontend test
      - name: Audit dependencies
        run: pnpm --dir frontend audit --audit-level high
      - name: Generate frontend SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-file frontend/frontend-sbom.json --spec-version 1.6 --output-format JSON --validate frontend/package.json
      - name: Verify frontend SBOM
        run: node -e "const fs=require('fs'); const bom=JSON.parse(fs.readFileSync('frontend/frontend-sbom.json','utf8')); if (bom.bomFormat !== 'CycloneDX') throw new Error('frontend SBOM is not CycloneDX');"
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.json
