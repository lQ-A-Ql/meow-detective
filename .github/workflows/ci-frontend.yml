name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'scripts/check-frontend-*.ps1'
      - 'scripts/lib/FrontendArchitectureGuard.mjs'
      - 'scripts/lib/frontend-source-policy.mjs'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Frontend lockfile policy
        shell: pwsh
        run: ./scripts/check-frontend-lockfile-policy.ps1
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Frontend architecture guard (layering, UI primitives, centralised assets)
        shell: pwsh
        run: |
          ./scripts/check-frontend-architecture.ps1 -SelfTest
          ./scripts/check-frontend-architecture.ps1
          ./scripts/check-frontend-ui-boundary.ps1
          ./scripts/check-frontend-runtime-guard.ps1
      - name: IPC contract guards (DTO mirror, event topics)
        shell: pwsh
        run: |
          ./scripts/check-dto-drift.ps1
          ./scripts/check-event-topic-drift.ps1
      - name: Media protocol guard
        shell: pwsh
        run: ./scripts/check-media-protocol-guard.ps1
      - name: Build
        run: pnpm --dir frontend build
      - name: Test
        run: pnpm --dir frontend test
      - name: Coverage
        run: pnpm --dir frontend test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Audit dependencies
        run: pnpm --dir frontend audit --audit-level high
      - name: Generate frontend SBOM
        working-directory: frontend
        run: pnpm dlx @cyclonedx/cdxgen@12.8.6 -t js --no-install-deps --no-recurse --no-babel --fail-on-error --spec-version 1.6 -o frontend-sbom.json .
      - name: Verify frontend SBOM
        run: node -e "const fs=require('fs'); const bom=JSON.parse(fs.readFileSync('frontend/frontend-sbom.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || bom.specVersion !== '1.6' || !bom.components?.length || !bom.dependencies?.length) throw new Error('frontend SBOM is missing its CycloneDX component/dependency graph');"
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.json
